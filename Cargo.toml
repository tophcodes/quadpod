[package]
name = "sparql-pod"
version = "0.1.0"
edition = "2021"

[lib]
name = "sparql_pod"

[[bin]]
name = "sparql-pod"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
dpop-verifier = "4.4.0"
hex = "0.4.3"
http = "1.4.2"
josekit = "0.10.3"
object_store = "0.14.1"
oxigraph = "0.5.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rudof_lib = { version = "0.3.7", default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
